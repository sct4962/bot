<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique MiniApp Telegram</title>
    <!-- SDK Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --tag-bg: rgba(15, 23, 42, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px; /* Espace pour la barre du bas */
        }

        /* --- En-tête Utilisateur --- */
        .user-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .welcome-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .welcome-tag::before {
            content: "•";
            font-size: 1rem;
        }

        .username {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* --- Barre d'outils et Filtre --- */
        .controls-section {
            padding: 0 16px 12px 16px;
        }

        .count-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .filter-select {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        /* --- Grille des Produits --- */
        .catalog-container {
            padding: 0 16px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .image-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Square ratio */
            background-color: #000;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag-overlay {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: var(--tag-bg);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
        }

        .product-details {
            padding: 10px;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Vue Détails Produit --- */
        #details-view {
            display: none;
            padding: 16px;
        }

        .details-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
        }

        .details-img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .details-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .details-price {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .details-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 100%;
            background-color: var(--card-border);
            color: var(--text-color);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- Barre de Navigation Inférieure Simplifiée --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-decoration: none;
            position: relative;
            cursor: pointer;
            width: 22%;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .badge-count {
            position: absolute;
            top: -2px;
            right: 20px;
            background-color: #ef4444;
            color: white;
            font-size: 0.6rem;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- En-tête Profil Utilisateur -->
    <div class="user-header">
        <div class="avatar" id="user-avatar">S</div>
        <div class="user-info">
            <span class="welcome-tag">Bienvenue</span>
            <span class="username" id="username-display">sct4962</span>
        </div>
    </div>

    <!-- VUE CATALOGUE PRINCIPAL -->
    <div id="catalog-view">
        <!-- Compteur & Filtre par Catégorie -->
        <div class="controls-section">
            <div class="count-badge" id="product-count">0 produits</div>
            <select class="filter-select" id="category-filter" onchange="filterProducts()">
                <option value="all">Voir tout</option>
                <option value="cat1">Catégorie 1</option>
                <option value="cat2">Catégorie 2</option>
            </select>
        </div>

        <!-- Liste des Cartes Produits -->
        <div class="catalog-container">
            <div class="product-grid" id="product-grid">
                <!-- Rempli dynamiquement par JS -->
            </div>
        </div>
    </div>

    <!-- VUE DÉTAILS D'UN PRODUIT -->
    <div id="details-view">
        <div class="details-card">
            <img id="details-img" class="details-img" src="" alt="Produit">
            <h2 id="details-title" class="details-title">Titre</h2>
            <div id="details-price" class="details-price">0.00 €</div>
            <p id="details-desc" class="details-desc">Description...</p>
            <button class="back-btn" onclick="showCatalog()">← Retour à la boutique</button>
        </div>
    </div>

    <!-- Barre de Navigation en Bas (Simplifiée) -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="showCatalog()">
            <span class="nav-icon">🏠</span>
            <span>Accueil</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">ℹ️</span>
            <span>Infos</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">🛒</span>
            <span class="badge-count">1</span>
            <span>Panier</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">✉️</span>
            <span>Contact</span>
        </div>
    </nav>

    <script>
        // Initialisation de l'API Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Récupération de l'utilisateur Telegram réel si disponible
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const name = user.username || user.first_name || "sct4962";
            document.getElementById('username-display').textContent = name;
            document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
        }

        // Base de données des produits
        const products = [
            {
                id: 1,
                title: "Perm x Zeclair 🌑⚡",
                tag: "PREMIUM STATIC US...",
                category: "cat1",
                price: "45.00 €",
                image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+1",
                description: "Voici la description complète et détaillée du Produit 1."
            },
            {
                id: 2,
                title: "Dosi x Fruitloop 🍇🌈",
                tag: "PREMIUM STATIC US...",
                category: "cat1",
                price: "50.00 €",
                image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+2",
                description: "Voici la description complète et détaillée du Produit 2."
            },
            {
                id: 3,
                title: "Galactic Warheadz 📐",
                tag: "PREMIUM STATIC US...",
                category: "cat2",
                price: "35.00 €",
                image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+3",
                description: "Voici la description complète et détaillée du Produit 3."
            },
            {
                id: 4,
                title: "Jumbo Gusherz 🍇",
                tag: "PREMIUM STATIC US...",
                category: "cat2",
                price: "40.00 €",
                image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+4",
                description: "Voici la description complète et détaillée du Produit 4."
            }
        ];

        // Rendu dynamique de la grille des produits
        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            const countLabel = document.getElementById('product-count');
            
            grid.innerHTML = '';
            countLabel.textContent = `${items.length} produit${items.length > 1 ? 's' : ''}`;

            items.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => showDetails(prod.id);

                card.innerHTML = `
                    <div class="image-container">
                        <img class="product-img" src="${prod.image}" alt="${prod.title}">
                        <div class="tag-overlay">🏷️ ${prod.tag}</div>
                    </div>
                    <div class="product-details">
                        <div class="product-title">${prod.title}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filtrer les produits
        function filterProducts() {
            const selectedCategory = document.getElementById('category-filter').value;

            if (selectedCategory === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === selectedCategory);
                renderProducts(filtered);
            }
        }

        // Afficher la vue de détails
        function showDetails(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('details-img').src = prod.image;
            document.getElementById('details-title').textContent = prod.title;
            document.getElementById('details-price').textContent = prod.price;
            document.getElementById('details-desc').textContent = prod.description;

            document.getElementById('catalog-view').style.display = 'none';
            document.getElementById('details-view').style.display = 'block';

            // Afficher le bouton Retour natif Telegram
            tg.BackButton.show();
            tg.BackButton.onClick(showCatalog);
        }

        // Revenir au catalogue
        function showCatalog() {
            document.getElementById('details-view').style.display = 'none';
            document.getElementById('catalog-view').style.display = 'block';

            tg.BackButton.hide();
            tg.BackButton.offClick(showCatalog);
        }

        // Initialisation
        renderProducts(products);
    </script>
</body>
</html>
