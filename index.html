<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique MiniApp Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .welcome-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .welcome-tag::before {
            content: "•";
            font-size: 1rem;
        }

        .username {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .controls-section {
            padding: 0 16px 12px 16px;
        }

        .count-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .filter-select {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .catalog-container {
            padding: 0 16px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .image-container {
            position: relative;
            width: 100%;
            padding-top: 100%;
            background-color: #000;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-details {
            padding: 10px;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 700;
        }

        .page-view {
            display: none;
            padding: 16px;
        }

        .details-card, .cart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 16px;
        }

        .details-img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .details-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .details-price {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .details-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
        }

        .btn-secondary {
            background-color: var(--card-border);
            color: var(--text-color);
        }

        .btn-success {
            background-color: var(--success-color);
            color: #fff;
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
        }

        .cart-item-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background-color: var(--card-border);
            color: var(--text-color);
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-decoration: none;
            position: relative;
            cursor: pointer;
            width: 22%;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .badge-count {
            position: absolute;
            top: -2px;
            right: 18px;
            background-color: var(--danger-color);
            color: white;
            font-size: 0.65rem;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="user-header">
        <div class="avatar" id="user-avatar">S</div>
        <div class="user-info">
            <span class="welcome-tag">Bienvenue</span>
            <span class="username" id="username-display">sct4962</span>
        </div>
    </div>

    <div id="catalog-view">
        <div class="controls-section">
            <div class="count-badge" id="product-count">0 produits</div>
            <select class="filter-select" id="category-filter" onchange="filterProducts()">
                <option value="all">Voir tout</option>
                <option value="cat1">Catégorie 1</option>
                <option value="cat2">Catégorie 2</option>
            </select>
        </div>

        <div class="catalog-container">
            <div class="product-grid" id="product-grid"></div>
        </div>
    </div>

    <div id="details-view" class="page-view">
        <div class="details-card">
            <img id="details-img" class="details-img" src="" alt="Produit">
            <h2 id="details-title" class="details-title">Titre</h2>
            <div id="details-price" class="details-price">0.00 €</div>
            <p id="details-desc" class="details-desc">Description...</p>
            <button class="btn btn-primary" id="add-to-cart-btn">🛒 Ajouter au panier</button>
            <button class="btn btn-secondary" onclick="showCatalog()">← Retour à la boutique</button>
        </div>
    </div>

    <div id="cart-view" class="page-view">
        <div class="cart-card">
            <h2 style="margin-bottom: 16px;">Mon Panier</h2>
            <div id="cart-items-container"></div>
            
            <div class="cart-total-row">
                <span>Total :</span>
                <span id="cart-total-price" style="color: var(--accent-color);">0.00 €</span>
            </div>

            <button class="btn btn-success" onclick="submitOrder()">🛍️ Valider la commande</button>
            <button class="btn btn-secondary" onclick="showCatalog()">← Continuer mes achats</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="showCatalog()">
            <span class="nav-icon">🏠</span>
            <span>Accueil</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">ℹ️</span>
            <span>Infos</span>
        </div>
        <div class="nav-item" id="nav-cart" onclick="showCart()">
            <span class="nav-icon">🛒</span>
            <span class="badge-count" id="cart-badge">0</span>
            <span>Panier</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">✉️</span>
            <span>Contact</span>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_USERNAME = "soulaxbot";

        let telegramUser = { username: "sct4962", first_name: "Client" };
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            telegramUser = tg.initDataUnsafe.user;
            const name = telegramUser.username || telegramUser.first_name;
            document.getElementById('username-display').textContent = name;
            document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
        }

        const products = [
            { id: 1, title: "Perm x Zeclair 🌑⚡", category: "cat1", price: 45.00, image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+1", description: "Description détaillée du produit 1." },
            { id: 2, title: "Dosi x Fruitloop 🍇🌈", category: "cat1", price: 50.00, image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+2", description: "Description détaillée du produit 2." },
            { id: 3, title: "Galactic Warheadz 📐", category: "cat2", price: 35.00, image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+3", description: "Description détaillée du produit 3." },
            { id: 4, title: "Jumbo Gusherz 🍇", category: "cat2", price: 40.00, image: "https://via.placeholder.com/300/111827/38bdf8?text=Produit+4", description: "Description détaillée du produit 4." }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            document.getElementById('product-count').textContent = `${items.length} produit${items.length > 1 ? 's' : ''}`;

            items.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => showDetails(prod.id);
                card.innerHTML = `
                    <div class="image-container">
                        <img class="product-img" src="${prod.image}" alt="${prod.title}">
                    </div>
                    <div class="product-details">
                        <div class="product-title">${prod.title}</div>
                        <div class="product-price">${prod.price.toFixed(2)} €</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const cat = document.getElementById('category-filter').value;
            renderProducts(cat === 'all' ? products : products.filter(p => p.category === cat));
        }

        function setActiveNav(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(id) document.getElementById(id).classList.add('active');
        }

        function showCatalog() {
            document.querySelectorAll('.page-view').forEach(el => el.style.display = 'none');
            document.getElementById('catalog-view').style.display = 'block';
            setActiveNav('nav-home');
            tg.BackButton.hide();
        }

        function showDetails(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('details-img').src = prod.image;
            document.getElementById('details-title').textContent = prod.title;
            document.getElementById('details-price').textContent = `${prod.price.toFixed(2)} €`;
            document.getElementById('details-desc').textContent = prod.description;
            
            document.getElementById('add-to-cart-btn').onclick = () => {
                addToCart(prod.id);
                showCart();
            };

            document.getElementById('catalog-view').style.display = 'none';
            document.getElementById('cart-view').style.display = 'none';
            document.getElementById('details-view').style.display = 'block';

            tg.BackButton.show();
            tg.BackButton.onClick(showCatalog);
        }

        function showCart() {
            renderCart();
            document.getElementById('catalog-view').style.display = 'none';
            document.getElementById('details-view').style.display = 'none';
            document.getElementById('cart-view').style.display = 'block';
            setActiveNav('nav-cart');

            tg.BackButton.show();
            tg.BackButton.onClick(showCatalog);
        }

        function addToCart(productId) {
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                const prod = products.find(p => p.id === productId);
                cart.push({ id: prod.id, title: prod.title, price: prod.price, quantity: 1 });
            }
            updateCartBadge();
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCartBadge();
            renderCart();
        }

        function updateCartBadge() {
            const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
            document.getElementById('cart-badge').textContent = totalItems;
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Votre panier est vide.</p>`;
                document.getElementById('cart-total-price').textContent = '0.00 €';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div class="cart-item-info">
                        <span class="cart-item-title">${item.title}</span>
                        <span class="cart-item-price">${item.price.toFixed(2)} € x ${item.quantity} = ${itemTotal.toFixed(2)} €</span>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                    </div>
                `;
                container.appendChild(row);
            });

            document.getElementById('cart-total-price').textContent = `${total.toFixed(2)} €`;
        }

        function submitOrder() {
            if (cart.length === 0) {
                tg.showAlert("Votre panier est vide !");
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            let text = "🚨 *NOUVELLE COMMANDE*\n\n";
            cart.forEach(item => {
                text += `• ${item.title} (x${item.quantity}) - ${(item.price * item.quantity).toFixed(2)}€\n`;
            });
            text += `\n💰 *Total :* ${totalAmount.toFixed(2)} €`;

            const url = `https://t.me/${BOT_USERNAME}?text=${encodeURIComponent(text)}`;
            tg.openTelegramLink(url);
            tg.close();
        }

        renderProducts(products);
    </script>
</body>
</html>
